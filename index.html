<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cash Puzzle HD</title><style>body{margin:0;background:#0f172a;color:white;font-family:sans-serif;text-align:center}h1{margin:15px 0 5px}#board{width:90vw;max-width:360px;height:90vw;max-height:360px;margin:15px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:#1e293b;padding:5px;border-radius:12px}.tile{height:100%;background-size:300% 300%;background-image:url('https://images.unsplash.com/photo-1580519542036-c47de6196ba5?w=600');border-radius:8px}.tile.empty{background:#0f172a!important}button{background:#22c55e;color:white;border:none;padding:12px 24px;border-radius:20px;font-weight:bold;margin-top:10px;font-size:16px}</style></head><body><h1>💵 CASH PUZZLE HD 💰</h1><div>Langkah: <span id="moves">0</span></div><div id="board"></div><button onclick="shuffle()">ACAK LAGI</button><script>let moves=0,empty=8,tiles=[0,1,2,3,4,5,6,7,8];const board=document.getElementById('board');function render(){board.innerHTML='';tiles.forEach((v,i)=>{let d=document.createElement('div');d.className=v==8?'tile empty':'tile';if(v!=8)d.style.backgroundPosition=`${(v%3)*50}% ${Math.floor(v/3)*50}%`;d.onclick=()=>move(i);board.appendChild(d);});}function move(i){let r=Math.floor(i/3),c=i%3,er=Math.floor(empty/3),ec=empty%3;if(Math.abs(r-er)+Math.abs(c-ec)==1){[tiles[i],tiles[empty]]=[tiles[empty],tiles[i]];empty=i;moves++;document.getElementById('moves').innerText=moves;render();checkWin();}}function shuffle(){for(let k=0;k<300;k++){let n=[],r=Math.floor(empty/3),c=empty%3;if(r>0)n.push(empty-3);if(r<2)n.push(empty+3);if(c>0)n.push(empty-1);if(c<2)n.push(empty+1);let p=n[Math.floor(Math.random()*n.length)];[tiles[p],tiles[empty]]=[tiles[empty],tiles[p]];empty=p;}moves=0;document.getElementById('moves').innerText=0;render();}function checkWin(){for(let i=0;i<9;i++)if(tiles[i]!=i)return;setTimeout(()=>alert('MENANG! 💰 Langkah:'+moves),200);}render();shuffle();</script></body></html>
